<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenRoute Tài xế</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { max-width: 640px; margin: 0 auto; }
    .d-head { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
    .d-head h1 { font-size: 18px; margin: 0; }
    .d-sum { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .stop { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 16px; }
    .stop.delivered { opacity: .65; border-left: 4px solid var(--green); }
    .stop.failed { border-left: 4px solid var(--red); }
    .stop h3 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
    .stop .meta { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .actions button, .actions a { flex: 1; min-height: 44px; font-size: 15px; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    .actions a { background: #e8f2ec; color: var(--green); }
    .fail-box { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .fail-box select, .fail-box input { min-height: 40px; }
  </style>
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-box">
      <h2>🌿 GreenRoute — Tài xế</h2>
      <input name="username" placeholder="Tên đăng nhập" autocomplete="username" required>
      <input name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button>Đăng nhập</button>
      <div id="login-error" class="err" hidden></div>
    </form>
    <form id="pw-form" class="login-box" hidden>
      <h2>Đổi mật khẩu</h2>
      <p class="hint">Đặt mật khẩu mới trước khi sử dụng (tối thiểu 8 ký tự).</p>
      <input name="old_password" type="password" placeholder="Mật khẩu hiện tại" autocomplete="current-password" required>
      <input name="new_password" type="password" placeholder="Mật khẩu mới" autocomplete="new-password" required minlength="8">
      <input name="confirm" type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required minlength="8">
      <button>Lưu mật khẩu</button>
      <div id="pw-error" class="err" hidden></div>
    </form>
  </div>

  <div class="d-head">
    <div class="topbar">
      <h1 id="d-title">🚚 Tuyến của tôi</h1>
      <div><button id="btn-refresh" class="secondary">↻</button> <button id="btn-logout" class="secondary">Đăng xuất</button></div>
    </div>
    <div id="d-sum" class="d-sum"></div>
  </div>
  <div id="d-body"></div>

  <script src="auth.js"></script>
  <script src="driver.js"></script>
</body>
</html>
